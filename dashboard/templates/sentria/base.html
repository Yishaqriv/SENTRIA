{% load static %}<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}SENTRIA{% endblock %} | SENTRIA</title>
    <link rel="icon" href="{% static 'sentria/marca/favicon.svg' %}" type="image/svg+xml">
    <link rel="icon" href="{% static 'sentria/marca/favicon-32.png' %}" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="{% static 'sentria/marca/favicon-180.png' %}">
    <link rel="stylesheet" href="{% static 'sentria/css/sentria.css' %}">
    {# Sin JavaScript los controles plegables se muestran siempre desplegados. #}
    <script>document.documentElement.classList.add('js');</script>
</head>
<body class="{% block body_class %}{% endblock %}">
<div class="fondo" aria-hidden="true"></div>
{% block body %}{% endblock %}
<script src="{% static 'sentria/js/sentria.js' %}" defer></script>
</body>
</html>
