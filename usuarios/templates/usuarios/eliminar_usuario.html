<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar usuario | SENTRIA</title>
</head>
<body>

<h1>Eliminar usuario</h1>

<p>¿Seguro que quieres eliminar a <strong>{{ usuario.username }}</strong>?</p>

<a href="{% url 'lista_usuarios' %}">Cancelar</a>

</body>
</html>
